name: CI

# Constitution: no deploy jobs, no secrets — lint/format/test/build gates only.
on:
  push:
    branches: [main, '001-tokenized-vault-dapp']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge fmt + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with OpenZeppelin submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the exact local release (forge 1.8.5, commit 51a52c59)
          # so `forge fmt --check` output cannot drift between local and CI.
          version: v1.8.5

      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check

      - name: forge test
        working-directory: contracts
        run: forge test

  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          # Node 24 = the local + Vercel toolchain. jsdom 30 / undici 8 declare
          # engines node >=22.19, so Node 20 (EOL) cannot run the vitest jsdom
          # environment (`webidl.util.markAsUncloneable is not a function`).
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build
